<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💖 5 Bulan Bersama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #ffe0ec, #ffb6c1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.5);
        }
        h1 {
            font-size: 2.6rem;
            color: #b3416b;
            margin-bottom: 6px;
        }
        .sub {
            font-size: 1.1rem;
            color: #a14a6b;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .heart {
            font-size: 4rem;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }
        .message {
            font-size: 1.05rem;
            color: #4a2c38;
            line-height: 1.7;
            margin: 20px 0 16px;
            padding: 0 6px;
        }
        .date {
            background: #ffe2ed;
            padding: 12px 18px;
            border-radius: 60px;
            display: inline-block;
            font-weight: 600;
            color: #902b55;
            margin: 10px 0 16px;
            font-size: 0.95rem;
        }
        .btn {
            display: inline-block;
            background: #b3416b;
            color: #fff;
            padding: 14px 34px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.25s;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(179, 65, 107, 0.35);
        }
        .btn:hover {
            transform: scale(1.04);
            background: #9e2e57;
        }
        .qr-wrapper {
            margin: 28px 0 10px;
            padding: 18px;
            background: #fff;
            border-radius: 32px;
            display: inline-block;
        }
        .qr-wrapper img {
            width: 180px;
            height: 180px;
            display: block;
        }
        .footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #7e4d5e;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">💕</div>
        <h1>5 Bulan</h1>
        <div class="sub">— Anniversary —</div>
        <div class="date">📅 5 September 2026</div>
        <p class="message">
            Terima kasih untuk 5 bulan penuh cinta, tawa, dan cerita indah.<br />
            <strong>✨ Kamu adalah hadiah terbaik ✨</strong>
        </p>
        <a href="#" class="btn">💌 Baca Surat Cinta</a>

        <!-- QR Code untuk scan ke website ini -->
        <div class="qr-wrapper">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://https://gbt-nu.vercel.app" alt="QR Code Anniversary" />
        </div>
        <p style="font-size:0.9rem;color:#7e4d5e;">Scan QR untuk buka website</p>
        <div class="footer">made with ❤️ • 5 bulan & forever</div>
    </div>
</body>
</html>
